<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Slate-950 Background -->
  <rect width="1080" height="1080" fill="#020617"/>

  <!-- Ambient Glow Behind Badge -->
  <circle cx="540" cy="400" r="440" fill="url(#ambientGlow)"/>

  <!-- Logo Emblem Badge (400x400 centered horizontally at x=340, y=180) -->
  <g>
    <!-- Outer Gradient Border -->
    <rect x="340" y="180" width="400" height="400" rx="100" fill="url(#borderGrad)"/>
    <!-- Inner Slate-950 Card -->
    <rect x="358" y="198" width="364" height="364" rx="82" fill="#020617"/>
    <!-- Central Bold "C" Letter -->
    <text x="540" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, sans-serif" font-weight="900" font-size="255" fill="url(#textGrad)">C</text>
  </g>

  <!-- Main Brand Title: ciyo.in -->
  <text x="540" y="690" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, sans-serif" font-weight="800" font-size="84" fill="#ffffff" letter-spacing="-1">ciyo<tspan fill="#10b981">.in</tspan></text>

  <!-- Subtitle: CIYO ENTERPRISES -->
  <text x="540" y="756" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#e2e8f0" letter-spacing="8">CIYO ENTERPRISES</text>

  <!-- Business Verticals Tagline -->
  <text x="540" y="806" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, sans-serif" font-weight="600" font-size="16" fill="#64748b" letter-spacing="4">TECH  •  AGRO  •  DAIRY</text>
</svg>